  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; background: #f8fafc; }

    .hero-gradient {
      background: linear-gradient(160deg, #0b2b4a 0%, #1a4b7a 40%, #1e40af 100%);
      position: relative;
      overflow: hidden;
    }

    .hero-gradient::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-gradient::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -15%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(96, 165, 250, 0.06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .service-card {
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }
    .service-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(11,43,74,0.03), rgba(30,64,175,0.06));
      opacity: 0;
      transition: opacity 0.4s ease;
      border-radius: 24px;
    }
    .service-card:hover::before { opacity: 1; }
    .service-card:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow: 0 30px 60px -15px rgba(11, 43, 74, 0.25);
      border-color: #1e40af;
    }

    .pricing-card {
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
    }
    .pricing-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 30px 60px -15px rgba(11, 43, 74, 0.2);
      border-color: #1e40af;
    }

    .step-item {
      counter-increment: step;
      position: relative;
      transition: all 0.3s ease;
    }
    .step-item::before {
      content: counter(step);
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #0b2b4a, #1e40af);
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.3rem;
      box-shadow: 0 8px 24px rgba(11, 43, 74, 0.25);
      border: 3px solid white;
    }
    .steps-container { counter-reset: step; }
    .step-item:hover {
      transform: translateY(-6px);
      border-color: #1e40af;
      box-shadow: 0 12px 30px rgba(0,0,0,0.06);
    }

    .faq-question {
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .faq-question:hover { background: #f1f5f9; }
    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.3s ease;
      padding: 0 24px;
    }
    .faq-answer.open { max-height: 400px; padding: 0 24px 24px; }
    .faq-question .fa-chevron-down { transition: transform 0.3s ease; }
    .faq-question.open .fa-chevron-down { transform: rotate(180deg); }

    .gps-art {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1/1;
      margin: 0 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gps-art .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.08);
      animation: pulse-ring 3s ease-in-out infinite;
    }
    .gps-art .ring:nth-child(1) { width: 100%; height: 100%; animation-delay: 0s; }
    .gps-art .ring:nth-child(2) { width: 80%; height: 80%; animation-delay: 0.6s; }
    .gps-art .ring:nth-child(3) { width: 60%; height: 60%; animation-delay: 1.2s; }
    .gps-art .ring:nth-child(4) { width: 40%; height: 40%; animation-delay: 1.8s; }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.3; }
      50% { transform: scale(1.05); opacity: 0.6; }
      100% { transform: scale(0.95); opacity: 0.3; }
    }

    .gps-art .gps-icon-wrapper {
      position: relative;
      z-index: 10;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 50%;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .gps-art .gps-icon-wrapper i {
      font-size: 5rem;
      color: #60a5fa;
      text-shadow: 0 0 40px rgba(96, 165, 250, 0.3);
    }

    @media (max-width: 640px) {
      .hero-gradient { background: linear-gradient(160deg, #0b2b4a 0%, #1a4b7a 60%, #1e40af 100%); }
      .gps-art .gps-icon-wrapper { width: 100px; height: 100px; }
      .gps-art .gps-icon-wrapper i { font-size: 3.5rem; }
    }
    @media (max-width: 400px) {
      .gps-art .gps-icon-wrapper { width: 80px; height: 80px; }
      .gps-art .gps-icon-wrapper i { font-size: 2.8rem; }
    }
  </style>
</head>
