<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="ইজি নামজারি - আপনার প্রোফাইল" />
  <title>প্রোফাইল | ইজি নামজারি</title>
  <link rel="icon" href="https://res.cloudinary.com/zmoyykj7/image/upload/v1788431997/cvguf6okasanfhjzadhf.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; }
    .profile-card { transition: all 0.3s ease; }
    .profile-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.1); }
    .info-item { border-bottom: 1px solid #e2e8f0; padding: 12px 0; display: flex; justify-content: space-between; align-items: center; }
    .info-item:last-child { border-bottom: none; }
    .info-label { font-weight: 500; color: #475569; }
    .info-value { font-weight: 600; color: #0b2b4a; }
    .avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 4px solid #1e40af; }
    .badge-admin { background: #1e40af; color: white; padding: 4px 16px; border-radius: 40px; font-size: 0.75rem; font-weight: 700; margin-left: 8px; }
  </style>
</head>
<body>

  <!-- ===== PAGE CONTENT (SPA) ===== -->
  <div id="page-content">

    <!-- ===== Profile Section ===== -->
    <section class="py-12 sm:py-20 bg-gray-50">
      <div class="container mx-auto px-4 sm:px-6 max-w-3xl">

        <!-- Loading state -->
        <div id="loadingState" class="text-center py-12">
          <i class="fas fa-spinner fa-spin text-4xl text-[#1e40af]"></i>
          <p class="text-gray-600 mt-4">প্রোফাইল লোড হচ্ছে...</p>
        </div>

        <!-- Profile Card -->
        <div id="profileCard" class="hidden bg-white rounded-3xl shadow-xl p-6 sm:p-10 border border-gray-200 profile-card">
          
          <!-- Avatar & Name -->
          <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 mb-6">
            <img id="userAvatar" src="" alt="প্রোফাইল ছবি" class="avatar" />
            <div class="flex-1 text-center sm:text-left">
              <div class="flex items-center justify-center sm:justify-start gap-2">
                <h2 id="userDisplayName" class="text-2xl sm:text-3xl font-bold text-[#0b2b4a]"></h2>
                <span id="adminBadge" class="badge-admin hidden">অ্যাডমিন</span>
              </div>
              <p id="userEmailDisplay" class="text-gray-600 text-sm sm:text-base"></p>
              <p id="userPhoneDisplay" class="text-gray-600 text-sm sm:text-base"></p>
            </div>
          </div>

          <!-- User Info Grid (No "অ্যাকাউন্ট টাইপ" row) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-6">
            <div class="info-item">
              <span class="info-label"><i class="fas fa-id-card mr-2"></i>NID</span>
              <span id="userNid" class="info-value">—</span>
            </div>
            <div class="info-item">
              <span class="info-label"><i class="fas fa-calendar-alt mr-2"></i>জন্ম তারিখ</span>
              <span id="userDob" class="info-value">—</span>
            </div>
            <div class="info-item">
              <span class="info-label"><i class="fas fa-phone mr-2"></i>মোবাইল</span>
              <span id="userPhone" class="info-value">—</span>
            </div>
            <div class="info-item">
              <span class="info-label"><i class="fas fa-envelope mr-2"></i>ইমেইল</span>
              <span id="userEmail" class="info-value">—</span>
            </div>
          </div>

          <!-- Actions -->
          <div class="mt-8 flex flex-wrap gap-4 justify-center sm:justify-start">
            <a id="adminPanelLink" href="admin.html" class="hidden bg-[#0b2b4a] text-white px-6 py-3 rounded-xl font-semibold hover:bg-[#1e40af] transition shadow-md flex items-center gap-2">
              <i class="fas fa-cog"></i> অ্যাডমিন প্যানেল
            </a>
            <button id="logoutProfileBtn" class="bg-red-500 text-white px-6 py-3 rounded-xl font-semibold hover:bg-red-600 transition shadow-md flex items-center gap-2">
              <i class="fas fa-sign-out-alt"></i> লগআউট
            </button>
          </div>
        </div>

        <!-- Unauthorized / Not logged in -->
        <div id="unauthorizedState" class="hidden bg-white rounded-3xl shadow-xl p-12 text-center border border-gray-200">
          <i class="fas fa-lock text-6xl text-red-500 mb-4"></i>
          <h2 class="text-2xl font-bold text-[#0b2b4a]">অনুগ্রহ করে লগইন করুন</h2>
          <p class="text-gray-600 mt-2">আপনার প্রোফাইল দেখতে লগইন করুন।</p>
          <a href="auth.html" class="inline-block mt-6 bg-[#0b2b4a] text-white px-8 py-3 rounded-xl hover:bg-[#1e40af] transition">
            <i class="fas fa-sign-in-alt"></i> লগইন পেজে যান
          </a>
        </div>

      </div>
    </section>

  </div> <!-- end page-content -->

  <!-- ===================================================== -->
  <!-- ===== SCRIPTS ===== -->
  <!-- ===================================================== -->
  <script type="module">
    import { loadAllComponents } from './components.js';
    import { showToast } from './main.js';

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBOpiCSVD8O-uT4CR4_-e9kGpZ1uVHFG54",
      authDomain: "easy-namjari.firebaseapp.com",
      projectId: "easy-namjari",
      storageBucket: "easy-namjari.firebasestorage.app",
      messagingSenderId: "686038387625",
      appId: "1:686038387625:web:2a8eebba1b771844fcd2b8"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // DOM refs
    const loadingState = document.getElementById('loadingState');
    const profileCard = document.getElementById('profileCard');
    const unauthorizedState = document.getElementById('unauthorizedState');

    const userAvatar = document.getElementById('userAvatar');
    const userDisplayName = document.getElementById('userDisplayName');
    const userEmailDisplay = document.getElementById('userEmailDisplay');
    const userPhoneDisplay = document.getElementById('userPhoneDisplay');
    const userNid = document.getElementById('userNid');
    const userDob = document.getElementById('userDob');
    const userPhone = document.getElementById('userPhone');
    const userEmail = document.getElementById('userEmail');
    const adminBadge = document.getElementById('adminBadge');
    const adminPanelLink = document.getElementById('adminPanelLink');

    const logoutProfileBtn = document.getElementById('logoutProfileBtn');

    // লোড কম্পোনেন্ট (নেভবার, ফুটার, ফ্লোটিং বাটন)
    loadAllComponents('profile');

    // ===== Fetch and display profile =====
    async function loadProfile(user) {
      if (!user) {
        loadingState.classList.add('hidden');
        unauthorizedState.classList.remove('hidden');
        return;
      }

      loadingState.classList.remove('hidden');
      profileCard.classList.add('hidden');
      unauthorizedState.classList.add('hidden');

      try {
        const displayName = user.displayName || 'ব্যবহারকারী';
        const photoURL = user.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(displayName) + '&background=1e40af&color=fff&size=100';
        const email = user.email || 'ইমেইল নেই';

        // Get extra data from Firestore
        const docRef = db.collection('users').doc(user.uid);
        const docSnap = await docRef.get();
        let userData = {};
        if (docSnap.exists) {
          userData = docSnap.data();
        }

        // Check admin status from Firestore (userType === 'admin')
        const isAdmin = userData.userType === 'admin';

        // Populate UI
        userAvatar.src = photoURL;
        userAvatar.alt = displayName;
        userDisplayName.textContent = displayName;
        userEmailDisplay.textContent = email;
        userEmail.textContent = email;

        const phone = userData.phone || user.phoneNumber || '—';
        userPhoneDisplay.textContent = phone;
        userPhone.textContent = phone;

        userNid.textContent = userData.nid || '—';
        userDob.textContent = userData.dob ? new Date(userData.dob).toLocaleDateString('bn-BD') : '—';

        // Admin badge & panel link (only if admin)
        if (isAdmin) {
          adminBadge.classList.remove('hidden');
          adminPanelLink.classList.remove('hidden');
        } else {
          adminBadge.classList.add('hidden');
          adminPanelLink.classList.add('hidden');
        }

        loadingState.classList.add('hidden');
        profileCard.classList.remove('hidden');

      } catch (error) {
        console.error('Error loading profile:', error);
        loadingState.classList.add('hidden');
        unauthorizedState.classList.remove('hidden');
        showToast('প্রোফাইল লোড করতে ব্যর্থ হয়েছে', 'error');
      }
    }

    // ===== Auth state listener =====
    auth.onAuthStateChanged(user => {
      if (user) {
        loadProfile(user);
      } else {
        loadingState.classList.add('hidden');
        profileCard.classList.add('hidden');
        unauthorizedState.classList.remove('hidden');
      }
    });

    // ===== Logout =====
    async function handleLogout() {
      try {
        await auth.signOut();
        window.location.href = 'auth.html';
      } catch (error) {
        console.error('Logout error:', error);
        showToast('লগআউট ব্যর্থ হয়েছে', 'error');
      }
    }

    logoutProfileBtn.addEventListener('click', handleLogout);
  </script>

</body>
</html>
